name: Step 6 Validation

on:
  workflow_dispatch:
    inputs:
      mode:
        description: Validation mode
        required: true
        default: paper
        type: choice
        options: [paper, testnet]
  schedule:
    - cron: '*/30 * * * *'

jobs:
  step6:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Install backend dependencies
        run: python -m pip install --upgrade pip && python -m pip install -r backend/requirements.txt && python -m pip install pytest pytest-asyncio
      - name: Run Step 6 paper/testnet validation
        env:
          STEP6_AUDIT_DIR: artifacts/step6
        run: python -m backend.certification.step6_runner --mode "${{ inputs.mode || 'paper' }}" --bars 10000
      - name: Upload Step 6 audit artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: step6-audit-${{ github.run_id }}
          path: artifacts/step6/
          if-no-files-found: warn
