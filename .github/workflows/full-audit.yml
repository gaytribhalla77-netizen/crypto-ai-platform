name: IQ200 Full Audit

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  backend-audit:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: iq200
          POSTGRES_PASSWORD: iq200
          POSTGRES_DB: iq200_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U iq200 -d iq200_test"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Install backend dependencies
        run: python -m pip install --upgrade pip && python -m pip install -r backend/requirements.txt && python -m pip install pytest pytest-asyncio
      - name: Verify dependency health
        run: python -m pip check
      - name: Compile Python
        run: python -m compileall -q backend workers tests conftest.py scripts
      - name: Validate safe CI environment
        run: python scripts/validate_env.py
      - name: Run full test suite
        run: pytest -q
        env:
          INTEGRATION_DATABASE_URL: postgresql+asyncpg://iq200:iq200@127.0.0.1:5432/iq200_test
      - name: Run PostgreSQL integration smoke
        run: pytest -q tests/test_postgres_smoke.py
        env:
          INTEGRATION_DATABASE_URL: postgresql+asyncpg://iq200:iq200@127.0.0.1:5432/iq200_test
      - name: Run resilience/load smoke
        run: pytest -q tests/test_load_smoke.py

  web-audit:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
      - name: Install frontend dependencies
        run: npm install --ignore-scripts
      - name: Production build
        run: npm run build
      - name: Dependency audit
        run: npm audit --audit-level=high
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Browser E2E
        run: npm run e2e
