name: IQ200 Full Audit

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  backend-audit:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: .
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install backend dependencies
        run: python -m pip install --upgrade pip && python -m pip install -r backend/requirements.txt && python -m pip install pytest pytest-asyncio
      - name: Compile Python
        run: python -m compileall -q backend workers tests conftest.py
      - name: Run full test suite
        run: pytest -q

  web-audit:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: apps/web/package.json
      - name: Install frontend dependencies
        run: npm install
      - name: Production build
        run: npm run build
      - name: Dependency audit
        run: npm audit --audit-level=high
